[package]
name = "explorist"
version = "0.1.0"
edition = "2024"
description = "A fast, keyboard-friendly file manager for Windows"
rust-version = "1.85"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
trash = "5"
dirs = "7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tempfile = "3"
