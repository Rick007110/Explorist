[package]
name = "explorist"
version = "0.2.1"
edition = "2024"
description = "A fast, keyboard-friendly file manager for Windows"
rust-version = "1.85"
build = "build.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
trash = "5"
ureq = { version = "3", default-features = false, features = ["gzip"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
dirs = "7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
notify = "8"
open = "5"
regex = "1"
resvg = { version = "0.48", default-features = false }
self-replace = "1"
serde_json = "1"
tar = "0.4"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(windows)'.dependencies]
# Windows' own TLS: uses the system certificate store, nothing to compile.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tempfile = "3"

# Dragging files out to other apps. Linux would need GTK, so it's left out.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "2.1.1"
