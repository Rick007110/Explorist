[package]
name = "explorist"
version = "0.4.0"
edition = "2024"
description = "A fast, keyboard-friendly file manager for Windows"
license = "GPL-3.0-or-later"
rust-version = "1.85"
build = "build.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
trash = "5"
ureq = { version = "3", default-features = false, features = ["gzip"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
dirs = "7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
notify = "8"
open = "5"
regex = "1"
resvg = { version = "0.48", default-features = false }
rfd = "0.17"
# The quick search shortcut, which works while other apps have focus.
global-hotkey = "0.9"
# Fast byte search for searching every file name on the device.
memchr = "2"
# The icon in the notification area / menu bar, for Close to tray. On Linux
# it speaks D-Bus (StatusNotifierItem) itself, with no GTK.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
self-replace = "1"
serde_json = "1"
tar = "0.4"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# To ask whether the desktop shows tray icons at all (stock GNOME doesn't).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Hiding the Dock icon while Explorist sits in the menu bar.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
# App icons for quick search.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSGeometry", "NSString"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(windows)'.dependencies]
# A second renderer for PCs whose OpenGL is too old (no graphics driver,
# some virtual machines and Remote Desktop): Direct3D 12, which Windows can
# run in software when there's no graphics card. Only DX12, to stay small.
eframe = { version = "0.36", default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30", default-features = false, features = ["dx12", "std", "wgsl"] }
# Windows' own TLS: uses the system certificate store, nothing to compile.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tempfile = "3"

# Dragging files out to other apps. Linux would need GTK, so it's left out.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "2.1.1"
