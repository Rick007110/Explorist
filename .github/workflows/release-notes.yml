name: Release notes

# Rewrites published releases' notes from their CHANGELOG.md sections, for
# fixing notes after publishing: edit CHANGELOG.md, then push to the
# `release-notes` branch. Every version with both a section and a release
# is updated.
on:
  push:
    branches: [release-notes]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for version in $(sed -n 's/^## \([0-9][^ ]*\)$/\1/p' CHANGELOG.md); do
            if ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "v$version isn't released; skipping"
              continue
            fi
            awk -v v="$version" '/^## /{on = ($2 == v); next} on' CHANGELOG.md > notes.md
            gh release edit "v$version" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            echo "Updated v$version"
          done
