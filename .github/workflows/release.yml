name: Release

# Builds Explorist for Windows, Linux and macOS and publishes all three in
# one GitHub Release. Either push a tag like v0.2.0 (matching the version
# in Cargo.toml), or push a commit to the `release` branch and the tag
# v<Cargo.toml version> is created for it. The app's update check picks
# its platform's download. A version with a pre-release part, like
# 0.4.0-beta1, is published as a pre-release, which the update check skips.
# Pushing to `release-dry-run` builds every package without publishing, to
# try out packaging changes.
on:
  push:
    tags: ["v*"]
    branches: [release, release-dry-run]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" = "release" ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released; bump the version in Cargo.toml first"
            exit 1
          fi
          if ! grep -q "^## $version\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section; add the release notes first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $dir = "explorist-$env:VERSION"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/explorist.exe $dir/
          Copy-Item README.md $dir/
          Copy-Item assets/fonts/OFL.txt $dir/FONTS-OFL.txt
          Copy-Item assets/icons/lucide/LICENSE $dir/ICONS-LICENSE.txt
          Compress-Archive -Path $dir -DestinationPath "explorist-$env:VERSION-windows-x86_64.zip"
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc packaging/windows/explorist.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item dist/*.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            explorist-*-windows-x86_64.zip
            explorist-*-windows-x86_64-setup.exe

  linux:
    needs: version
    # The oldest supported runner, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        run: |
          dir="explorist-$VERSION"
          mkdir "$dir"
          cp target/release/explorist README.md "$dir/"
          cp assets/fonts/OFL.txt "$dir/FONTS-OFL.txt"
          cp assets/icons/lucide/LICENSE "$dir/ICONS-LICENSE.txt"
          cp assets/icon/icon-256.png "$dir/explorist.png"
          cat > "$dir/explorist.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Explorist
          Comment=Fast, keyboard-friendly file manager
          Exec=explorist %U
          Icon=explorist
          Categories=System;FileManager;Utility;
          MimeType=inode/directory;
          DESKTOP
          strip "$dir/explorist"
          tar -czf "explorist-$VERSION-linux-x86_64.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: explorist-*-linux-x86_64.tar.gz

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      # The same certificate signs every release, so macOS keeps the
      # permissions people gave Explorist (like Full Disk Access) across
      # updates; it ties them to the signature. It's self-signed, kept in
      # the MACOS_CERT_P12 (base64) and MACOS_CERT_PASSWORD secrets.
      # Without them, the app is signed ad hoc and macOS forgets.
      - name: Signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::warning::No MACOS_CERT_P12 secret: signing ad hoc"
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=Explorist Code Signing" >> "$GITHUB_ENV"
      - name: Package Explorist.app (Apple Silicon and Intel)
        run: |
          app="Explorist.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create \
            target/aarch64-apple-darwin/release/explorist \
            target/x86_64-apple-darwin/release/explorist \
            -output "$app/Contents/MacOS/explorist"
          cp assets/fonts/OFL.txt "$app/Contents/Resources/FONTS-OFL.txt"
          cp assets/icons/lucide/LICENSE "$app/Contents/Resources/ICONS-LICENSE.txt"
          cp assets/icon/icon.icns "$app/Contents/Resources/Explorist.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Explorist</string>
            <key>CFBundleDisplayName</key><string>Explorist</string>
            <key>CFBundleIdentifier</key><string>io.github.rick007110.explorist</string>
            <key>CFBundleExecutable</key><string>explorist</string>
            <key>CFBundleIconFile</key><string>Explorist</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # Not notarized. Signed with the certificate above (or ad hoc),
          # so Apple Silicon will run it.
          codesign --force --deep --sign "$SIGN_IDENTITY" "$app"
          codesign --verify --deep --strict "$app"
          codesign --display --requirements - "$app"
          if [ "$SIGN_IDENTITY" != "-" ]; then
            # A requirement naming the certificate is what keeps permissions.
            codesign --display --requirements - "$app" 2>&1 | grep -q "certificate"
          fi
          # The zip is for the app's updater; people download the disk image.
          ditto -c -k --keepParent "$app" "explorist-$VERSION-macos-universal.zip"
          mkdir dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Explorist -srcfolder dmg -ov -format UDZO \
            "explorist-$VERSION-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            explorist-*-macos-universal.zip
            explorist-*-macos-universal.dmg

  publish:
    needs: [version, windows, linux, macos]
    if: github.ref_name != 'release-dry-run'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '/^## /{on = ($2 == v); next} on' CHANGELOG.md > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Explorist ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: notes.md
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
