name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build
# explorist.exe on Windows and publish it as a GitHub Release. The app's
# update check looks for the "*windows*.zip" asset of the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: cargo test --release
      - run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $dir = "explorist-$env:VERSION"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/explorist.exe $dir/
          Copy-Item README.md $dir/
          Copy-Item assets/fonts/OFL.txt $dir/FONTS-OFL.txt
          Compress-Archive -Path $dir -DestinationPath "explorist-$env:VERSION-windows-x86_64.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: explorist-*-windows-x86_64.zip
          generate_release_notes: true
