name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: cargo clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy-output.txt || {
            # Annotations show without downloading the log.
            grep -E "(error|warning)(\[|:)" clippy-output.txt | head -10 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test 2>&1 | tee test-output.txt || {
            # Surface failures as annotations so they show without the full
            # log. GitHub keeps at most 10 per step, so list names in one.
            echo "::error::Failed: $(grep -oE '^test [^ ]+ \.\.\. FAILED' test-output.txt | cut -d' ' -f2 | tr '\n' ' ')"
            grep -A1 -E "panicked|left:|right:|error\[|^error:" test-output.txt | grep -v "^--" | head -9 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Update end to end
        shell: bash
        run: |
          set -o pipefail
          scripts/update-test.sh 2>&1 | tee update-output.txt || {
            tail -n 8 update-output.txt | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
