name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test 2>&1 | tee test-output.txt || {
            # Surface failures as annotations so they show without the full
            # log. GitHub keeps at most 10 per step, so list names in one.
            echo "::error::Failed: $(grep -oE '^test [^ ]+ \.\.\. FAILED' test-output.txt | cut -d' ' -f2 | tr '\n' ' ')"
            grep -A1 -E "panicked|left:|right:|error\[" test-output.txt | grep -v "^--" | head -9 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - run: cargo build --release
